<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#04070f" />
    <title>Spaced Out</title>
  </head>
  <body>
    <canvas id="game" aria-label="Spaced Out asteroid flight game"></canvas>
    <div class="hud">
      <header>
        <span class="brand">SPACED <b>OUT</b></span>
        <span class="status"><i></i> FLIGHT SYSTEM ONLINE</span>
      </header>
      <button class="settings-toggle" id="settings-toggle" type="button">SETTINGS</button>
      <button class="missions-toggle" id="missions-toggle" type="button">MISSIONS</button>
      <div class="missions-panel hidden" id="missions-panel" aria-label="Mission selection">
        <button class="mission-option" id="mission-1" type="button">MISSION 1</button>
        <button class="mission-option" id="mission-2" type="button">MISSION 2</button>
        <button class="mission-option" id="mission-3" type="button">MISSION 3</button>
        <button class="mission-option" id="mission-4" type="button">MISSION 4</button>
      </div>
      <div class="settings-panel hidden" id="settings-panel" aria-label="Ship control tuning">
        <div class="settings-section">
          <div class="settings-row">
            <label for="dampening-slider">DAMPENING</label>
            <input type="range" id="dampening-slider" min="0" max="6" step="0.1" value="2" />
            <output id="dampening-value">2</output>
          </div>
          <div class="settings-row">
            <label for="thrust-slider">THRUST</label>
            <input type="range" id="thrust-slider" min="0" max="500" step="10" value="500" />
            <output id="thrust-value">500</output>
          </div>
          <div class="settings-row">
            <label for="maxspeed-slider">MAX SPEED</label>
            <input type="range" id="maxspeed-slider" min="100" max="1500" step="50" value="1000" />
            <output id="maxspeed-value">1000</output>
          </div>
          <div class="settings-row">
            <label for="music-slider">MUSIC</label>
            <input type="range" id="music-slider" min="0" max="100" step="1" value="50" />
            <output id="music-value">50</output>
          </div>
          <div class="settings-row">
            <label for="zoom-slider">ZOOM</label>
            <input type="range" id="zoom-slider" min="0.5" max="2" step="0.05" value="1.15" />
            <output id="zoom-value">1.15</output>
          </div>
          <div class="settings-row">
            <label for="sfx-master-slider">SFX</label>
            <input type="range" id="sfx-master-slider" min="0" max="100" step="1" value="60" />
            <output id="sfx-master-value">60</output>
          </div>
        </div>
        <div class="settings-dev hidden" id="settings-dev" aria-label="Development tuning">
          <div class="settings-dev-header">DEV</div>
          <div class="settings-row">
            <label for="particle-slider">PARTICLES</label>
            <input type="range" id="particle-slider" min="0" max="100" step="5" value="40" />
            <output id="particle-value">40</output>
          </div>
          <div class="settings-row">
            <label for="sfx-thrust-slider">ENGINE</label>
            <input type="range" id="sfx-thrust-slider" min="0" max="100" step="1" value="46" />
            <output id="sfx-thrust-value">46</output>
          </div>
          <div class="settings-row">
            <label for="sfx-laser-slider">LASER</label>
            <input type="range" id="sfx-laser-slider" min="0" max="100" step="1" value="50" />
            <output id="sfx-laser-value">50</output>
          </div>
          <div class="settings-row">
            <label for="sfx-laser-hit-slider">LASER HIT</label>
            <input type="range" id="sfx-laser-hit-slider" min="0" max="100" step="1" value="61" />
            <output id="sfx-laser-hit-value">61</output>
          </div>
          <div class="settings-row">
            <label for="sfx-asteroid-slider">ROCK HIT</label>
            <input type="range" id="sfx-asteroid-slider" min="0" max="100" step="1" value="42" />
            <output id="sfx-asteroid-value">42</output>
          </div>
          <div class="settings-row">
            <label for="sfx-ship-slider">SHIP HIT</label>
            <input type="range" id="sfx-ship-slider" min="0" max="100" step="1" value="100" />
            <output id="sfx-ship-value">100</output>
          </div>
          <div class="settings-row">
            <label for="sfx-collectable-slider">PICKUP</label>
            <input type="range" id="sfx-collectable-slider" min="0" max="100" step="1" value="100" />
            <output id="sfx-collectable-value">100</output>
          </div>
          <div class="settings-row">
            <label for="lamp-slider">LAMP</label>
            <input type="range" id="lamp-slider" min="120" max="900" step="40" value="320" />
            <output id="lamp-value">320</output>
          </div>
        </div>
      </div>
      <div class="speed"><b id="speed-warning">WARNING</b><span id="speed">000</span><small>m/s</small></div>
      <div class="distance hidden" id="distance" aria-label="Distance to destination">
        <div class="distance-label"><span>DISTANCE</span><b id="distance-value">0</b></div>
        <div class="distance-track"><i id="distance-fill"></i></div>
      </div>
      <div class="resources" aria-label="Ship resources">
        <div class="resource fuel">
          <div class="resource-label"><span>FUEL</span><b id="fuel-value">100</b></div>
          <div class="resource-track"><i id="fuel-fill"></i></div>
        </div>
        <div class="resource hp">
          <div class="resource-label"><span>HULL</span><b id="hp-value">100</b></div>
          <div class="resource-track"><i id="hp-fill"></i></div>
        </div>
        <div class="resource ammo">
          <div class="resource-label"><span>AMMO</span><b id="ammo-value">100</b></div>
          <div class="resource-track"><i id="ammo-fill"></i></div>
        </div>
        <div class="resource shield hidden" id="shield">
          <div class="resource-label"><span>SHIELD</span><b id="shield-value">0</b></div>
          <div class="resource-track"><i id="shield-fill"></i></div>
        </div>
      </div>
      <div class="hint" id="hint">
        <strong>HOLD TO THRUST</strong>
        <span>Point to steer · momentum carries you</span>
      </div>
      <div class="mission-goals hidden" id="mission-goals" aria-label="Mission goals">
        <div class="mission-goals-header">OBJECTIVES</div>
        <ul id="mission-goals-list"></ul>
      </div>
    </div>
    <div class="game-over hidden" id="game-over">
      <strong>GAME OVER</strong>
      <span>click to launch a new flight</span>
    </div>
    <div class="mission hidden" id="mission" role="dialog" aria-label="Mission briefing">
      <strong id="mission-title"></strong>
      <span id="mission-signal"></span>
      <span id="mission-detail">Click to continue.</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
